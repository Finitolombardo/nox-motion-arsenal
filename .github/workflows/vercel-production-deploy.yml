name: Vercel Production Deploy

on:
  pull_request:
    paths:
      - '.github/workflows/vercel-production-deploy.yml'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nox-motion-arsenal-production-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  credentials:
    name: credentials
    runs-on: ubuntu-latest
    steps:
      - name: Verify Vercel token is configured
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN repository secret is not configured."
            exit 1
          fi
          echo "VERCEL_TOKEN is configured."

  deploy:
    name: production
    if: github.event_name != 'pull_request'
    needs: credentials
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run build
          npm test

      - name: Link exact Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"orgId":"team_TXrN6nY8qaVpd26aRnX741rV","projectId":"prj_4xAbkEUC6U59MjVJS66ErLe9U2U7","projectName":"nox-motion-arsenal"}
          JSON

      - name: Deploy tested commit to production
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@54.14.0 deploy --prod --yes

      - name: Record deployed source
        run: echo "Deployed $GITHUB_SHA to production project nox-motion-arsenal"
